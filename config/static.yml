global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false

  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
  format: common

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  # Named "websecure" for compatibility with Ozone HIS (ozone-docker-compose)
  # http.tls applies TLS by default to all routers on this entrypoint (no per-service tls: true needed)
  websecure:
    address: ":443"
    http:
      tls: {}
